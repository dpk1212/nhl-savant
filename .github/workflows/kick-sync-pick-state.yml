# One-shot: restake today's card from main (OG-EDGE last, etc.).
name: kick-sync-pick-state

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/_kick_sync_pick_state.txt'
      - '.github/workflows/kick-sync-pick-state.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: syncPickStateAuthoritative
        run: node scripts/syncPickStateAuthoritative.js
