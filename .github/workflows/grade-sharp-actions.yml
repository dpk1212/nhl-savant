name: Grade Sharp Actions

on:
  schedule:
    # Wallet bets and the sports the 10-minute function cannot settle
    # (Nations League, CONCACAF, ATP challengers) grade here.
    # ET, November onward (UTC-5): noon, 2, 4, 6, 8, 10pm, midnight, 2am, 4am.
    - cron: '0 1,3,5,7,9,17,19,21,23 * * *'
  workflow_dispatch:

jobs:
  grade-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Grade sharp actions
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/gradeSharpActions.js

      - name: Sync wallet bets collection
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          # These three steps load most of sharp_action_positions into memory.
          # Node's default limit (about 2 GB) was reached on 2026-11-21 and the
          # sync step crashed. GitHub's standard runner for a public repo has 16 GB.
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/syncWalletBets.js --write

      # Rebuilds whitelist tiers + profile.clvSkill (causal %+CLV / beats-the-close).
      # clvSkill is the standing TAPE input consumed by Sharp Flow cards and
      # must stay in lock-step with src/lib/walletClvSkill.js.
      - name: Rebuild sharp wallet profiles (whitelist + clvSkill)
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/exportWalletProfiles.js --write-firebase

      # As-of Sharp tier × size × opposition hist WR/$ROI for Action row stamps.
      # Rebuilds after grades so cell stats track newly settled plays.
      - name: Rebuild Sharp tier cell stats lookup
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/exportSharpTierCellStats.js --write-firebase

      - name: Commit updated wallet profile artifacts
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wallet-profiles.json data/moved-against-ledger.json data/sharp-tier-cell-stats.json public/sharp-tier-cell-stats.json WALLET_ROSTER.md WALLET_PROFILES_SUMMARY.md
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update: Sharp wallet profiles + tier cell stats [$(TZ='America/New_York' date +'%Y-%m-%d %H:%M')] [skip ci]" &&
            git checkout -- data/clv-skill-ledger.json || true
            rm -f data/t5-season-ledger.json
            for i in 1 2 3 4 5 6; do
              git pull --rebase -X theirs && git push && exit 0
              echo "Push attempt $i failed, retrying..."
              sleep 8
            done
            echo "profile commit did not reach main"
            exit 1
          )

      # One compressed copy of every wallet profile, in a few documents
      # (walletProfilesPacked). STAGE ONE: nothing reads it yet. The page and
      # every job read what they read before.
      #
      # Last step on purpose, with continue-on-error and its own time limit:
      # a failure or a hang here cannot change grading, the profile export,
      # or the commit above. The script writes only its own collection, and
      # only when data/wallet-profiles.json and the profile documents are
      # from the same export run and the copy reads back identical.
      #
      # Runs even when an earlier step failed (for example the commit above
      # could not push): the profile documents may already be rebuilt, and
      # the copy should follow them. If they were not rebuilt, the script
      # sees the stamp does not match the file and publishes nothing.
      - name: Publish packed wallet profiles (nothing reads this yet)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node scripts/publishPackedWalletProfiles.js --write
