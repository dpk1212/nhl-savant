name: Publish Live Board (90s)

# The only routine writer to gh-pages.
#
# Fetch Odds and Fetch Wallet Positions push JSON to the live-data branch,
# which does not trigger a GitHub Pages build. This job copies those files
# plus the ledger JSON on main (Polymarket board, Kalshi board, Sharp Flow
# P&L) onto gh-pages once every 90 seconds. One Pages build is in flight.
# A ledger full build still force-pushes gh-pages about every 24 minutes;
# the next cycle here puts the fast files back.
#
# 30 × 90s ≈ 45 min/run, then self-dispatch while 5am–11pm ET.
on:
  schedule:
    - cron: '0 10 * * *'   # 6:00 AM ET
    - cron: '0 16 * * *'   # 12:00 PM ET
    - cron: '0 20 * * *'   # 4:00 PM ET
    - cron: '0 22 * * *'   # 6:00 PM ET
    - cron: '0 0 * * *'    # 8:00 PM ET
    - cron: '0 2 * * *'    # 10:00 PM ET
  workflow_dispatch:

concurrency:
  group: publish-live-board
  cancel-in-progress: false

jobs:
  publish-live-board:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish cycle loop (30× at 90s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          # shellcheck disable=SC1091
          source scripts/lib/gitLiveData.sh
          target_interval=90
          cycles=30
          GHP=/tmp/gh-pages-publish
          LIVE=/tmp/live-data-publish
          FAST_FILES="pinnacle_history.json pinnacle_steam.json odds_heartbeat.json sharp_positions.json sharp_spread_positions.json sharp_total_positions.json scan_heartbeat.json sharp_intel_excluded_wallets.json sharp_scan_supplement.json whitelist_scan_diagnostics.json"
          MAIN_FILES="polymarket_data.json kalshi_data.json sharp-flow-pnl.json"
          echo "--- clone gh-pages ---"
          if ! clone_branch "$GHP" gh-pages 0; then
            echo "::error::gh-pages clone failed"
            exit 1
          fi
          if ! clone_branch "$LIVE" live-data 0; then
            echo "::warning::live-data not ready — publishing ledger JSON from main only"
            LIVE=""
          fi
          for i in $(seq 1 "$cycles"); do
            cycle_start=$(date +%s)
            echo ""
            echo "### Publish cycle $i/${cycles} — $(date -u +%H:%M:%S) UTC"
            if [ -z "$LIVE" ] || [ ! -d "$LIVE/.git" ]; then
              LIVE=/tmp/live-data-publish
              if ! clone_branch "$LIVE" live-data 0; then
                echo "live-data still missing"
                LIVE=""
              fi
            fi
            publish_gh_pages "$GHP" "$LIVE" "$FAST_FILES" "$MAIN_FILES" "Publish live board" \
              || echo "publish failed (cycle $i)"
            if [ "$i" -lt "$cycles" ]; then
              remain=$(( target_interval - ($(date +%s) - cycle_start) ))
              if [ "$remain" -gt 0 ]; then
                echo "--- sleeping ${remain}s ---"
                sleep "$remain"
              else
                echo "--- cycle overran ${target_interval}s ---"
              fi
            fi
          done
          echo "### Publish loop complete — $(date -u +%H:%M:%S) UTC"

      - name: Chain next publish (5am–11pm ET)
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          hour=$(TZ=America/New_York date +%H)
          hour=$((10#$hour))
          echo "### ET now: $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z') (hour=${hour})"
          if [ "$hour" -lt 5 ] || [ "$hour" -ge 23 ]; then
            echo "### Outside 5am–11pm ET — chain stops"
            exit 0
          fi
          queued=$(gh run list --workflow publish-live-board.yml --repo "$GH_REPO" --status queued --limit 10 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          queued=$((10#${queued:-0}))
          if [ "$queued" -gt 0 ]; then
            echo "### Chain skipped — ${queued} already queued"
            exit 0
          fi
          inprog=$(gh run list --workflow publish-live-board.yml --repo "$GH_REPO" --status in_progress --limit 10 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          inprog=$((10#${inprog:-0}))
          if [ "$inprog" -gt 1 ]; then
            echo "### Chain skipped — ${inprog} in progress"
            exit 0
          fi
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh workflow run publish-live-board.yml --repo "$GH_REPO"; then
              echo "### Chained OK (attempt $attempt)"
              ok=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Publish chain failed after 5 attempts"
            exit 1
          fi
