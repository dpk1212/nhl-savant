name: Fetch Market Data (Polymarket + scan)

# ─── Scheduling (ledger, 2026-09-22) ────────────────────────────────────────
# GitHub Actions cron is unreliable at sub-15-min cadence (silently dropped).
# Fresh odds live in fetch-odds.yml (60s). Fresh wallet positions live in
# fetch-wallets.yml (90s). This job is the ledger: Polymarket board, Firestore
# action tickets, lock sync, and T−15 alerts. Inner loop 10 × 360s.
# If the fast jobs go stale (>3 min), this job still snapshots and scans so
# the board does not freeze. Self-dispatch the next run while 5am–11pm ET.
#
# Day window (America/New_York):
#   • Starter cron ~6am ET (10:00 UTC during EDT / 11:00 UTC during EST)
#   • Safety crons ~12pm / 4pm / 6pm / 8pm / 10pm ET if the chain broke
#   • End-of-run: if still 5am–11pm ET and nothing is queued → `gh workflow run`
#     (retries ×5; runs with always() so a loop warning can't kill the chain)
#   • After 11pm ET the chain stops until the next morning starter
#
# concurrency cancel-in-progress:false → queued safety/cron waits; no kill.
# Routine gh-pages writes belong to publish-live-board.yml (one commit
# every 90s). This job does not JSON-patch gh-pages — that raced the fast
# jobs and GitHub cancelled the Pages build. Cycle 1 and every 4th still
# full-build so UI commits on main land. Those builds copy odds and
# positions from live-data first so a force-push cannot roll them backward.
# Kalshi native board lives in fetch-kalshi.yml (main only). The publisher
# copies kalshi_data.json from main; a full build here also ships it.
# Firestore: syncPickStateAuthoritative runs once per cycle. The old
# post-deploy second sync is gone. Wallet profiles reuse a 30-min cache
# when the checkout JSON is behind Firestore.
on:
  schedule:
    # 6:00 AM ET  (EDT=10:00 UTC · EST=11:00 UTC — pinned to EDT summer)
    - cron: '0 10 * * *'
    # Safety restarts if self-chain died. Extra evening coverage — a single
    # failed "Chain next fetch" step previously left a ~10h overnight hole
    # (last success ~9pm ET → next ~7am ET on 2026-07-20).
    - cron: '0 16 * * *'   # 12:00 PM ET
    - cron: '0 20 * * *'   # 4:00 PM ET
    - cron: '0 22 * * *'   # 6:00 PM ET
    - cron: '0 0 * * *'    # 8:00 PM ET
    - cron: '0 2 * * *'    # 10:00 PM ET (covers late chain breaks before 11pm stop)
  workflow_dispatch:

concurrency:
  group: fetch-polymarket
  cancel-in-progress: false

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    # 100m clears 10× ~6m cycles plus a fallback scan if the wallet job is down.
    # 58m timed out mid-loop on 2026-07-29 (job cancelled → chain skipped).
    timeout-minutes: 100
    permissions:
      contents: write
      actions: write   # required for end-of-run self-dispatch (gh workflow run)
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      # Server-side Firestore admin creds — needed by writeSharpActions and
      # syncPickStateAuthoritative inside the cycle loop. Without these the
      # browser-driven pick health sync was the only path keeping picks
      # in lock-step with live wallet state, which broke any time nobody had
      # the dashboard open (root cause of 2026-05-01 stale-state audit).
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      # OneSignal — paid-only T−15 lock alerts (sendLockAlerts.mjs)
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      # pinnapi — Pinnacle odds + max stake enricher for snapshotPinnacle.js
      # (optional; missing key falls back to Odds API only). Needs REST $99+
      # for production volume; free trial is prove-only (~100 req/day).
      PINNAPI_KEY: ${{ secrets.PINNAPI_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write build env
        run: |
          cat > .env <<EOF
          ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}
          PINNAPI_KEY=${{ secrets.PINNAPI_KEY }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          EOF

      - name: Configure git identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      # Ledger loop: 10 × 6 min. Odds and wallet files are owned by the fast
      # jobs. This loop writes the Polymarket board, Firestore, and alerts.
      # Each cycle targets 360s start-to-start. Overruns start the next
      # cycle immediately.
      - name: Ledger cycle loop (10× at 6-min cadence)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          # shellcheck disable=SC1091
          source scripts/lib/gitLiveData.sh
          target_interval=360
          cycles=10
          scan_fail_count=0
          LIVE=/tmp/live-data
          GHP=/tmp/gh-pages-live
          ODDS_FILES="pinnacle_history.json pinnacle_steam.json odds_heartbeat.json"
          SCAN_FILES="sharp_positions.json sharp_spread_positions.json sharp_total_positions.json scan_heartbeat.json sharp_intel_excluded_wallets.json sharp_scan_supplement.json whitelist_scan_diagnostics.json"
          FAST_FILES="$ODDS_FILES $SCAN_FILES"
          echo "--- clone live-data (freshness) ---"
          if clone_branch "$LIVE" live-data 0; then
            echo "--- live-data clone ok ---"
          else
            echo "::warning::live-data clone failed — freshness check uses gh-pages, then the checkout"
            LIVE=""
          fi
          echo "--- clone gh-pages (full-build fallback copy) ---"
          if clone_branch "$GHP" gh-pages 0; then
            echo "--- gh-pages clone ok ---"
          else
            echo "::warning::gh-pages clone failed — full build uses live-data or the checkout"
            GHP=""
          fi
          # Fast-job health lives on live-data. gh-pages lags by one publisher
          # cycle, which is enough to look "stale" and trigger a duplicate scan.
          refresh_fast_files() {
            if [ -n "$LIVE" ] && refresh_branch "$LIVE" live-data; then
              copy_files_from "$LIVE" "$FAST_FILES"
              return 0
            fi
            if [ -n "$GHP" ] && refresh_branch "$GHP" gh-pages; then
              copy_files_from "$GHP" "$FAST_FILES"
              return 0
            fi
            return 1
          }
          for i in $(seq 1 "$cycles"); do
            cycle_start=$(date +%s)
            ran_snapshot=0
            ran_scan=0
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "### Cycle $i/${cycles} — $(date -u +%H:%M:%S) UTC"
            echo "════════════════════════════════════════════════════════════"

            echo "--- refresh fast files from live-data ---"
            if ! refresh_fast_files; then
              echo "::warning::fast-file refresh failed — freshness check uses the checkout"
            fi

            echo "--- fetchPolymarketData ---"
            node scripts/fetchPolymarketData.js || echo "polymarket failed (cycle $i)"

            # Odds job owns the tape. Snapshot here only when that file is
            # older than 3 minutes (job down, or first boot before it pushes).
            echo "--- odds freshness ---"
            odds_fresh=0
            if [ -f public/odds_heartbeat.json ]; then
              if node --input-type=module -e '
                import { readFileSync } from "fs";
                const j = JSON.parse(readFileSync("public/odds_heartbeat.json", "utf8"));
                const age = (Date.now() - Date.parse(j.updatedAt)) / 1000;
                console.log("odds heartbeat age " + (Number.isFinite(age) ? age.toFixed(0) : "?") + "s");
                if (!Number.isFinite(age) || age > 180 || age < -60) process.exit(1);
              '; then
                odds_fresh=1
              fi
            fi
            if [ "$odds_fresh" -eq 1 ]; then
              echo "--- snapshotPinnacle skipped (fetch-odds.yml is fresh) ---"
            else
              echo "--- snapshotPinnacle (fallback) ---"
              if node scripts/snapshotPinnacle.js; then
                ran_snapshot=1
                echo "--- prunePinnacleHistory ---"
                if ! node scripts/prunePinnacleHistory.js; then
                  echo "::error::prunePinnacleHistory failed (cycle $i) — reverting tape file to HEAD so main can still push"
                  git checkout HEAD -- public/pinnacle_history.json 2>/dev/null || true
                  ran_snapshot=0
                fi
              else
                echo "pinnacle failed (cycle $i)"
              fi
            fi

            # Wallet job owns positions. Scan here only when the heartbeat
            # is older than 3 minutes.
            echo "--- scan freshness ---"
            scan_fresh=0
            if SCAN_HEARTBEAT_MAX_AGE_SEC=180 node scripts/checkScanHeartbeat.js; then
              scan_fresh=1
            fi
            if [ "$scan_fresh" -eq 1 ]; then
              echo "--- scanSharpPositions skipped (fetch-wallets.yml is fresh) ---"
            else
              echo "--- discoverScanSupplement (fallback) ---"
              node scripts/discoverScanSupplement.js || echo "discoverScanSupplement failed (cycle $i — non-fatal)"
              echo "--- scanSharpPositions (fallback) ---"
              scan_rc=0
              SCAN_CONCURRENCY=12 node scripts/scanSharpPositions.js || scan_rc=$?
              if [ "$scan_rc" -ne 0 ]; then
                echo "::error::scanSharpPositions failed (cycle $i, exit $scan_rc)"
                scan_fail_count=$((scan_fail_count + 1))
              elif ! node scripts/checkScanHeartbeat.js; then
                echo "::warning::scan heartbeat stale/missing after successful scan exit (cycle $i)"
                scan_fail_count=$((scan_fail_count + 1))
              else
                ran_scan=1
              fi
              echo "--- scanWhitelistedWallets (fallback) ---"
              node scripts/scanWhitelistedWallets.js || echo "whitelist scan failed (cycle $i — non-fatal, main scan unaffected)"
            fi

            # Fallback odds/positions have to land on live-data. The publisher
            # copies that branch, and it would otherwise keep shipping the
            # stale fast-job files over this cycle's snapshot.
            if [ "$ran_snapshot" -eq 1 ] || [ "$ran_scan" -eq 1 ]; then
              if [ -z "$LIVE" ] || [ ! -d "$LIVE/.git" ]; then
                LIVE=/tmp/live-data
                if clone_branch "$LIVE" live-data 1; then
                  echo "--- live-data created for fallback publish ---"
                else
                  LIVE=""
                fi
              fi
              fb_files=""
              if [ "$ran_snapshot" -eq 1 ]; then
                fb_files="$fb_files $ODDS_FILES"
              fi
              if [ "$ran_scan" -eq 1 ]; then
                fb_files="$fb_files $SCAN_FILES"
              fi
              if [ -n "$LIVE" ] && [ -d "$LIVE/.git" ]; then
                push_files_to_branch "$LIVE" live-data "$fb_files" "Ledger fallback" \
                  || echo "::warning::fallback live-data push failed (cycle $i)"
              else
                echo "::warning::no live-data checkout — fallback stays on main until the next full build"
              fi
            fi

            # ── Firestore-side pipeline ─────────────────────────────────────
            # writeSharpActions persists the just-scanned positions (with
            # vault_hc* fields) to sharp_action_positions. Then
            # syncPickStateAuthoritative recomputes every today's LOCKED/LEAN
            # pick's health/tier from those positions and writes the canonical
            # state to sharpFlowPicks/Spreads/Totals. This is the server-side
            # mirror of the browser's syncPickHealth — it runs whether or not
            # anyone has the dashboard open, so picks stay current with the
            # 4-min fetch cadence right up to T-15 freeze.
            echo "--- writeSharpActions ---"
            node scripts/writeSharpActions.js || echo "writeSharpActions failed (cycle $i)"

            # One Firestore write per ledger cycle. The fast odds/wallet jobs
            # never open Firestore. A failed sync retries on the next cycle
            # (~6 min). send-lock-alerts.yml remains the T−15 backup.
            echo "--- syncPickStateAuthoritative ---"
            if ! node scripts/syncPickStateAuthoritative.js; then
              echo "::warning::syncPickStateAuthoritative failed (cycle $i) — next ledger cycle retries"
            fi

            # Paid-only lock alerts: newly frozen LOCKED sides at T−15 →
            # OneSignal filter tag paid=true. Idempotent via lockAlertSentAt.
            echo "--- sendLockAlerts ---"
            if [ -n "${ONESIGNAL_REST_API_KEY:-}" ]; then
              node scripts/sendLockAlerts.mjs || echo "::warning::sendLockAlerts failed (cycle $i — non-fatal)"
            else
              echo "--- sendLockAlerts skipped (ONESIGNAL_REST_API_KEY not set) ---"
            fi

            echo "--- updateClosingOdds ---"
            node scripts/updateClosingOdds.js || echo "closingOdds failed (cycle $i)"

            echo "--- auditMarketData ---"
            node scripts/auditMarketData.js || true

            # All-time P&L JSON for Sharp Flow Record / AGS-U / L7-L30.
            # One Firestore scan ~hourly (script no-ops if file < 55 min old).
            # Do not run this every cycle — that would re-bill the archive read.
            echo "--- buildSharpFlowPnl ---"
            node scripts/buildSharpFlowPnl.mjs || echo "::warning::buildSharpFlowPnl failed (cycle $i — keeping last public/sharp-flow-pnl.json)"

            # Commit + push JSON changes to main (retry on conflict).
            # Include scan_heartbeat.json — leaving it unstaged used to make
            # `git pull --rebase` fail every cycle ("unstaged changes"), so the
            # market-data commit never reached origin/main and the hard-reset
            # below wiped the fresh scan before build/deploy (Vault stuck ~20h).
            # GitHub hard-rejects blobs > 100 MB (this is what stalled fetch).
            # If tape is still huge after prune, drop it from this commit.
            pinn_bytes=$(wc -c < public/pinnacle_history.json 2>/dev/null | tr -d ' ')
            if [ "${pinn_bytes:-0}" -gt 90000000 ]; then
              echo "::error::pinnacle_history.json is ${pinn_bytes} bytes (>90MB). Not staging it."
              git checkout HEAD -- public/pinnacle_history.json 2>/dev/null || true
            fi

            git add public/polymarket_data.json \
                    public/pinnacle_history.json public/sharp_positions.json \
                    public/sharp_spread_positions.json public/sharp_total_positions.json \
                    public/sharp_intel_excluded_wallets.json \
                    public/whitelist_scan_diagnostics.json \
                    public/scan_heartbeat.json \
                    public/sharp_scan_supplement.json \
                    public/sharp-flow-pnl.json 2>/dev/null || true
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update: Market data [$(date +'%Y-%m-%d %H:%M') cycle $i]"
              for attempt in 1 2 3; do
                if git pull --rebase --autostash -X theirs origin main && git push origin main; then
                  echo "--- main push succeeded (attempt $attempt) ---"
                  break
                fi
                echo "--- main push attempt $attempt failed, retrying ---"
                git status -sb || true
                sleep 2
              done
            else
              echo "--- no main-branch JSON changes this cycle ---"
            fi

            # Keep this cycle's market JSON across reset — if the push above
            # failed, origin/main is still stale and reset would otherwise
            # drop the fresh scan before we build/deploy to gh-pages.
            json_stash=$(mktemp -d)
            cp -f public/polymarket_data.json \
                  public/pinnacle_history.json public/sharp_positions.json \
                  public/sharp_spread_positions.json public/sharp_total_positions.json \
                  public/sharp_intel_excluded_wallets.json \
                  public/whitelist_scan_diagnostics.json \
                  public/scan_heartbeat.json \
                  public/sharp_scan_supplement.json \
                  public/sharp-flow-pnl.json \
                  "$json_stash/" 2>/dev/null || true

            # Pull latest main BEFORE building. This loop checks out once at
            # job start and runs ~10 cycles (~60 min). Without a mid-loop pull,
            # every gh-pages deploy rebuilds that stale checkout and silently
            # overwrites any UI/code deploys that landed on main after the job
            # started (card redesigns, vault fixes, etc.).
            echo "--- sync main before build ---"
            git fetch origin main
            git reset --hard origin/main
            cp -f "$json_stash"/* public/ 2>/dev/null || true
            rm -rf "$json_stash"

            # Full builds ship every public file. Re-copy odds and positions
            # from live-data when this cycle did not regenerate them, so the
            # force-push cannot roll a 60s tape back to the cycle-start copy.
            # A fallback snapshot still prunes before the push (GitHub rejects
            # blobs over 100 MB — 2026-08-14).
            if [ "$ran_snapshot" -eq 0 ] || [ "$ran_scan" -eq 0 ]; then
              fast_src=""
              if [ -n "$LIVE" ] && refresh_branch "$LIVE" live-data; then
                fast_src="$LIVE"
              elif [ -n "$GHP" ] && refresh_branch "$GHP" gh-pages; then
                fast_src="$GHP"
              else
                echo "::warning::pre-build fast-file refresh failed"
              fi
              if [ -n "$fast_src" ]; then
                if [ "$ran_snapshot" -eq 0 ]; then
                  copy_files_from "$fast_src" "$ODDS_FILES"
                fi
                if [ "$ran_scan" -eq 0 ]; then
                  copy_files_from "$fast_src" "$SCAN_FILES"
                fi
              fi
            fi
            if [ "$ran_snapshot" -eq 1 ]; then
              if [ -f scripts/prunePinnacleHistory.js ]; then
                echo "--- prunePinnacleHistory (pre-build) ---"
                node scripts/prunePinnacleHistory.js || true
              fi
            fi
            pinn_bytes=$(wc -c < public/pinnacle_history.json 2>/dev/null | tr -d ' ')
            if [ "${pinn_bytes:-0}" -gt 90000000 ]; then
              echo "::error::pre-build tape is ${pinn_bytes} bytes — omitting from dist so gh-pages can still push"
              printf '%s\n' "{\"error\":\"tape_omitted_over_github_limit\",\"bytes\":${pinn_bytes}}" \
                > public/pinnacle_history.json
            fi

            # Only cycle 1 and every 4th touch gh-pages (full Vite build).
            # Every other cycle leaves the branch to publish-live-board.yml.
            do_full_build=0
            if [ "$i" -eq 1 ] || [ $((i % 4)) -eq 0 ]; then
              do_full_build=1
            fi

            deploy_ok=0
            if [ "$do_full_build" -eq 1 ]; then
              echo "--- npm run build (cycle $i) ---"
              rm -rf dist
              if npm run build; then
                echo "--- deploying dist → gh-pages ---"
                (
                  cd dist
                  rm -rf .git
                  git init -q
                  git checkout -b gh-pages
                  git add -A
                  git -c user.email=actions@github.com -c user.name="GitHub Actions" \
                      commit -q -m "Deploy cycle $i [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
                  git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
                      HEAD:gh-pages
                ) && { echo "--- gh-pages push succeeded ---"; deploy_ok=1; } \
                  || echo "--- gh-pages push failed (cycle $i) ---"
                if [ "$deploy_ok" -eq 1 ]; then
                  GHP=/tmp/gh-pages-live
                  rm -rf "$GHP"
                  if git clone --depth 1 --branch gh-pages \
                      "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$GHP"; then
                    echo "--- gh-pages clone refreshed after full deploy ---"
                  else
                    GHP=""
                  fi
                fi
              else
                echo "--- build failed (cycle $i), skipping deploy ---"
              fi
            else
              echo "--- publisher owns gh-pages; skipping JSON push (cycle $i) ---"
            fi

            cycle_elapsed=$(( $(date +%s) - cycle_start ))
            echo "### Cycle $i took ${cycle_elapsed}s (target ${target_interval}s start-to-start)"
            if [ "$i" -lt "$cycles" ]; then
              remain=$(( target_interval - cycle_elapsed ))
              if [ "$remain" -gt 0 ]; then
                echo "--- sleeping ${remain}s until next cycle ---"
                sleep "$remain"
              else
                echo "--- cycle overran target; running next cycle immediately ---"
              fi
            fi
          done
          echo ""
          echo "### All ${cycles} cycles complete — $(date -u +%H:%M:%S) UTC"
          echo "### scanSharpPositions failure count: ${scan_fail_count}/${cycles}"
          # Do NOT fail the job on scan errors — that previously skipped the
          # chain step's default success gate on some runners and opened a
          # multi-hour hole. Surface the signal; chain step below always runs.
          if [ "$scan_fail_count" -ge 3 ]; then
            echo "::error::${scan_fail_count} scan failures this job — investigate Polymarket/API, but chain continues"
          fi
          set -e

      # Self-chain: keep a fetch running 5am–11pm ET without hourly cron babysitting.
      # CRITICAL: must run even if the cycle loop warned/errored — a failed
      # chain step on 2026-07-20 killed coverage from ~9pm→7am ET.
      # Skips if another run is already queued (safety cron / prior dispatch).
      - name: Chain next fetch (5am–11pm ET)
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          hour=$(TZ=America/New_York date +%H)
          hour=$((10#$hour))
          et_now=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
          echo "### ET now: ${et_now} (hour=${hour})"

          if [ "$hour" -lt 5 ] || [ "$hour" -ge 23 ]; then
            echo "### Outside 5am–11pm ET window — chain stops until morning starter cron"
            exit 0
          fi

          queued=$(gh run list \
            --workflow fetch-polymarket.yml \
            --repo "$GH_REPO" \
            --status queued \
            --limit 10 \
            --json databaseId \
            --jq 'length' 2>/dev/null || echo 0)
          queued=$((10#${queued:-0}))
          if [ "$queued" -gt 0 ]; then
            echo "### Chain skipped — ${queued} run(s) already queued (concurrency will drain)"
            exit 0
          fi

          # Also skip if an in-progress sibling already exists beyond ourselves
          # (race: two finishers both try to chain). Prefer queued check above;
          # in_progress>1 means concurrency will serialize the next starter.
          inprog=$(gh run list \
            --workflow fetch-polymarket.yml \
            --repo "$GH_REPO" \
            --status in_progress \
            --limit 10 \
            --json databaseId \
            --jq 'length' 2>/dev/null || echo 0)
          inprog=$((10#${inprog:-0}))
          if [ "$inprog" -gt 1 ]; then
            echo "### Chain skipped — ${inprog} in_progress runs (sibling still working)"
            exit 0
          fi

          echo "### Dispatching next fetch-polymarket run…"
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh workflow run fetch-polymarket.yml --repo "$GH_REPO"; then
              echo "### Chained OK (attempt $attempt)"
              ok=1
              break
            fi
            echo "::warning::gh workflow run failed (attempt $attempt) — retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Chain dispatch failed after 5 attempts — safety crons must restart the loop"
            exit 1
          fi