name: Fetch Wallet Positions (90s)

# Fresh sharp positions for the open tab. Publishes the position files to
# the live-data branch. Does not open Firestore, does not push main, and
# does not push gh-pages. publish-live-board.yml copies live-data onto
# the site.
#
# 20 × 90s ≈ 30 min/run, then self-dispatch while 5am–11pm ET.
# Polymarket allows 150 /positions reads per 10 seconds. 895 wallets at
# concurrency 12 stays under that cap; a full pass cannot beat ~60s, so
# the target is 90s. Discovery and the whitelist recovery run every 15
# minutes, not in front of every scan.
#
# If this job dies, fetch-polymarket.yml scans as a fallback once the
# heartbeat is older than 3 minutes.
on:
  schedule:
    - cron: '0 10 * * *'   # 6:00 AM ET
    - cron: '0 16 * * *'   # 12:00 PM ET
    - cron: '0 20 * * *'   # 4:00 PM ET
    - cron: '0 22 * * *'   # 6:00 PM ET
    - cron: '0 0 * * *'    # 8:00 PM ET
    - cron: '0 2 * * *'    # 10:00 PM ET
  workflow_dispatch:

concurrency:
  group: fetch-wallets
  cancel-in-progress: false

jobs:
  fetch-wallets:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: write
    env:
      SCAN_CONCURRENCY: '12'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wallet cycle loop (20× at 90s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          # shellcheck disable=SC1091
          source scripts/lib/gitLiveData.sh
          target_interval=90
          cycles=20
          discover_every=900
          last_discover=0
          LIVE=/tmp/live-data
          FILES="sharp_positions.json sharp_spread_positions.json sharp_total_positions.json scan_heartbeat.json sharp_intel_excluded_wallets.json sharp_scan_supplement.json whitelist_scan_diagnostics.json"
          echo "--- clone live-data ---"
          if ! clone_branch "$LIVE" live-data 1; then
            echo "::error::live-data clone failed"
            exit 1
          fi
          for i in $(seq 1 "$cycles"); do
            cycle_start=$(date +%s)
            now=$(date +%s)
            echo ""
            echo "### Wallet cycle $i/${cycles} — $(date -u +%H:%M:%S) UTC"
            # Today's games land on main from the ledger. Pick that file up
            # without taking the rest of a dirty worktree.
            git fetch origin main --quiet || echo "::warning::could not fetch main for polymarket_data"
            git checkout origin/main -- public/polymarket_data.json 2>/dev/null || true
            if [ $((now - last_discover)) -ge "$discover_every" ]; then
              echo "--- discoverScanSupplement ---"
              node scripts/discoverScanSupplement.js || echo "discover failed (non-fatal)"
              last_discover=$(date +%s)
              do_whitelist=1
            else
              do_whitelist=0
            fi
            scan_rc=0
            node scripts/scanSharpPositions.js || scan_rc=$?
            if [ "$scan_rc" -ne 0 ]; then
              echo "::error::scanSharpPositions failed (cycle $i, exit $scan_rc) — not publishing"
            elif ! node scripts/checkScanHeartbeat.js; then
              echo "::error::heartbeat stale after scan (cycle $i) — not publishing"
            else
              if [ "$do_whitelist" -eq 1 ]; then
                echo "--- scanWhitelistedWallets ---"
                node scripts/scanWhitelistedWallets.js || echo "whitelist failed (non-fatal)"
              fi
              push_files_to_branch "$LIVE" live-data "$FILES" "Wallet cycle" \
                || echo "publish failed (cycle $i)"
            fi
            if [ "$i" -lt "$cycles" ]; then
              remain=$(( target_interval - ($(date +%s) - cycle_start) ))
              if [ "$remain" -gt 0 ]; then
                echo "--- sleeping ${remain}s ---"
                sleep "$remain"
              else
                echo "--- cycle overran ${target_interval}s ---"
              fi
            fi
          done
          echo "### Wallet loop complete — $(date -u +%H:%M:%S) UTC"

      - name: Chain next wallet fetch (5am–11pm ET)
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          hour=$(TZ=America/New_York date +%H)
          hour=$((10#$hour))
          echo "### ET now: $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z') (hour=${hour})"
          if [ "$hour" -lt 5 ] || [ "$hour" -ge 23 ]; then
            echo "### Outside 5am–11pm ET — chain stops"
            exit 0
          fi
          queued=$(gh run list --workflow fetch-wallets.yml --repo "$GH_REPO" --status queued --limit 10 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          queued=$((10#${queued:-0}))
          if [ "$queued" -gt 0 ]; then
            echo "### Chain skipped — ${queued} already queued"
            exit 0
          fi
          inprog=$(gh run list --workflow fetch-wallets.yml --repo "$GH_REPO" --status in_progress --limit 10 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          inprog=$((10#${inprog:-0}))
          if [ "$inprog" -gt 1 ]; then
            echo "### Chain skipped — ${inprog} in progress"
            exit 0
          fi
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh workflow run fetch-wallets.yml --repo "$GH_REPO"; then
              echo "### Chained OK (attempt $attempt)"
              ok=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Wallet chain failed after 5 attempts"
            exit 1
          fi
